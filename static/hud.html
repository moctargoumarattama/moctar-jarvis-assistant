<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M.O.C.T.A.R · HUD 3D Cybernétique</title>
  <link rel="icon" type="image/png" href="/static/icons/moctar-192.png">
  <style>
    :root {
      --bg-deep: #02060e;
      --cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.45);
      --blue: #0066ff;
      --green: #00ff88;
      --gold: #ffb700;
      --magenta: #d900ff;
      --red: #ff3b30;
      --text: #e2f4ff;
      --muted: #62829e;
      --chip-bg: rgba(6, 18, 34, 0.72);
      --chip-border: rgba(0, 243, 255, 0.28);
      --font-mono: "SF Mono", "Fira Code", "Courier New", monospace;
      --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text);
      font-family: var(--font-ui);
    }

    /* --- Viewport 3D WebGL --- */
    #hud-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #hud-viewport:active {
      cursor: grabbing;
    }

    #hud-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* --- Couche Holographique Flottante --- */
    .hud-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 22px;
    }

    .interactive {
      pointer-events: auto !important;
    }

    /* --- En-tête Supérieur --- */
    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--chip-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--chip-border);
      border-radius: 24px;
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .pill-btn:hover {
      background: rgba(0, 243, 255, 0.18);
      border-color: var(--cyan);
      box-shadow: 0 0 16px var(--cyan-glow);
      color: #fff;
    }

    /* Horloge Centrale */
    .hud-center-clock {
      text-align: center;
      background: var(--chip-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--chip-border);
      padding: 6px 22px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .clock-time {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: 0 0 14px var(--cyan-glow);
      line-height: 1.1;
    }

    .clock-date {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Télémétrie Supérieure Droite */
    .telemetry-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 8px 16px;
      background: var(--chip-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--chip-border);
      border-radius: 24px;
      font-family: var(--font-mono);
      font-size: 11px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .telemetry-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
    }

    .telemetry-item strong {
      color: var(--cyan);
      font-weight: 700;
    }

    .status-online {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-weight: 700;
      font-size: 10px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-ring 1.8s infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.8); opacity: 0.4; }
    }

    /* --- Sélecteur de Modes 3D Flottant --- */
    .hud-modes-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .mode-pill {
      padding: 7px 16px;
      background: var(--chip-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--chip-border);
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .mode-pill:hover {
      color: var(--cyan);
      border-color: var(--cyan);
      background: rgba(0, 243, 255, 0.12);
      transform: translateY(-1px);
    }

    .mode-pill.active {
      color: #fff;
      background: rgba(0, 243, 255, 0.25);
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(0, 243, 255, 0.45);
    }

    /* Badge d'État Vocal Flottant */
    .voice-state-pill {
      position: absolute;
      top: 86px;
      left: 22px;
      padding: 6px 14px;
      background: var(--chip-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--chip-border);
      border-radius: 18px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--cyan);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .voice-state-pill[data-state="listening"] {
      color: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(255, 183, 0, 0.4);
    }

    .voice-state-pill[data-state="processing"] {
      color: var(--magenta);
      border-color: var(--magenta);
      box-shadow: 0 0 15px rgba(217, 0, 255, 0.4);
    }

    .voice-state-pill[data-state="speaking"] {
      color: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    /* --- Ruban Inférieur Flottant --- */
    .hud-bottom-ribbon {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 920px;
      margin: 0 auto;
      width: 100%;
    }

    .transcript-box {
      background: var(--chip-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--chip-border);
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 52px;
      transition: all 0.3s ease;
    }

    .transcript-user {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--gold);
      font-weight: 600;
    }

    .transcript-assistant {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--cyan);
      line-height: 1.45;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }

    /* Ligne de Commande Hybride Flottante (Voice & Text) */
    .hud-cmd-form {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .hud-cmd-input {
      flex: 1;
      background: rgba(4, 14, 28, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--chip-border);
      border-radius: 20px;
      padding: 8px 18px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      outline: none;
      transition: all 0.25s ease;
    }

    .hud-cmd-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.35);
      background: rgba(6, 20, 38, 0.9);
    }

    .hud-cmd-input::placeholder {
      color: rgba(98, 130, 158, 0.7);
    }

    .hud-cmd-submit {
      padding: 8px 16px;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--cyan);
      border-radius: 20px;
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hud-cmd-submit:hover {
      background: var(--cyan);
      color: var(--bg-deep);
      box-shadow: 0 0 14px var(--cyan-glow);
    }

    /* Barre Inférieure Actions & GPS */
    .bottom-bar-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .gps-chip {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--green);
      letter-spacing: 0.08em;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.25);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .action-pills {
      display: flex;
      gap: 8px;
    }

    .btn-action-small {
      padding: 6px 16px;
      background: var(--chip-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--chip-border);
      border-radius: 18px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--cyan);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-action-small:hover {
      background: var(--cyan);
      color: var(--bg-deep);
      box-shadow: 0 0 14px var(--cyan-glow);
    }

    /* État Enregistrement Actif Micro */
    .btn-action-small.active {
      background: rgba(255, 183, 0, 0.25);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 16px rgba(255, 183, 0, 0.5);
      animation: pulse-ring 1.5s infinite;
    }

    .btn-action-small.stop {
      color: var(--red);
      border-color: rgba(255, 59, 48, 0.35);
    }
    .btn-action-small.stop:hover {
      background: var(--red);
      color: #fff;
      box-shadow: 0 0 14px rgba(255, 59, 48, 0.6);
    }
  </style>
</head>
<body>
  <!-- Conteneur 3D WebGL (Three.js) -->
  <div id="hud-viewport">
    <canvas id="hud-canvas"></canvas>
  </div>

  <!-- Couche Holographique Flottante -->
  <div class="hud-overlay">
    <!-- 1. En-tête Supérieur -->
    <div>
      <div class="hud-top-bar">
        <a href="/" class="pill-btn interactive" id="hud-return-noc" title="Retour au Centre de Commandement NOC">
          <span>◀</span> RETOUR NOC
        </a>

        <div class="hud-center-clock">
          <div class="clock-time" id="hud-clock-time">--:--:--</div>
          <div class="clock-date" id="hud-clock-date">SYSTEM CONNECTED</div>
        </div>

        <div class="telemetry-badge">
          <div class="telemetry-item">
            HOST: <strong id="hud-host-val">moctar-Precision-M4800</strong>
          </div>
          <div class="telemetry-item">
            CPU: <strong id="hud-cpu-val">--%</strong>
          </div>
          <div class="telemetry-item">
            RAM: <strong id="hud-ram-val">--%</strong>
          </div>
          <div class="status-online">
            <span class="pulse-dot"></span> EN LIGNE
          </div>
        </div>
      </div>

      <!-- 2. Sélecteur de Modes 3D Cinématiques -->
      <div class="hud-modes-row interactive">
        <button class="mode-pill active" id="btn-view-plasma" title="Réacteur à Arc Plasma Circulaire">
          ⚛️ ARC PLASMA
        </button>
        <button class="mode-pill" id="btn-view-quantum" title="Cœur Quantique Neuronal Rayonnant">
          🌌 QUANTUM CORE
        </button>
        <button class="mode-pill" id="btn-view-globe" title="Globe Terrestre Réaliste NASA 3D">
          🌐 GLOBE 3D
        </button>
        <button class="mode-pill" id="btn-action-locate" title="Verrouiller la caméra sur la position de Moctar">
          🎯 LOCALISER
        </button>
      </div>
    </div>

    <!-- Badge d'État Vocal Flottant -->
    <div class="voice-state-pill" id="voice-state-badge" data-state="idle">
      ● VEILLE ACTIVE
    </div>

    <!-- 3. Ruban Inférieur Flottant -->
    <div class="hud-bottom-ribbon">
      <div class="transcript-box" id="hud-dialogue-box">
        <div class="transcript-user" id="hud-user-transcript">« Parlez librement (« Yo Moctar ») ou cliquez sur le micro... »</div>
        <div class="transcript-assistant" id="hud-assistant-reply">M.O.C.T.A.R prêt et à l'écoute, Moctar.</div>
      </div>

      <!-- Ligne de Commande Directe Hybride (Voix / Texte) -->
      <form id="hud-cmd-form" class="hud-cmd-form interactive">
        <input type="text" id="hud-cmd-input" class="hud-cmd-input" placeholder="Tapez un ordre (ex: Affiche la Terre, Météo, CPU, Pause)..." autocomplete="off">
        <button type="submit" id="hud-cmd-submit" class="hud-cmd-submit" title="Envoyer">⚡ ENVOYER</button>
      </form>

      <div class="bottom-bar-controls interactive">
        <div class="gps-chip" id="hud-gps-coords">
          GPS : 34.0209°N, -6.8417°E (Rabat · Dell M4800)
        </div>

        <div class="action-pills">
          <button class="btn-action-small interactive" id="hud-mic-btn" title="Activer / Désactiver la capture micro">
            🎙️ MICRO
          </button>
          <button class="btn-action-small stop interactive" id="hud-stop-btn" title="Interrompre la synthèse vocale">
            ⏹️ STOP
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Moteur Three.js Local (Offline) -->
  <script src="/static/js/three.min.js"></script>
  <!-- Moteur Vocal Audio Réel & Wake-Word -->
  <script src="/static/voice.js?v=4.0"></script>
  <!-- Moteur Graphique HUD 3D & Contrôles -->
  <script src="/static/js/hud_3d.js?v=3.0"></script>
</body>
</html>
